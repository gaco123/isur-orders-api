services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isur_test
      POSTGRES_USER: isur_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isur_test -d isur_test"]
      interval: 5s
      timeout: 3s
      retries: 10